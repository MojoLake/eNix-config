interface:
  display_name: "Paper to Kindle"
  short_description: "Find, validate, and send papers or books to Kindle"
  default_prompt: "Use $paper-to-kindle to find this paper and send it to my Kindle."
dependencies:
  tools:
    - type: "mcp"
      value: "kindle_mail"
      description: "Local fixed-recipient Send-to-Kindle delivery tools"
      transport: "stdio"
